name: test-choco-ubuntu
on:
  push:
    branches:
      - chore/gh-actions-test
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Provide choco via Docker
        run: |
          sudo tee /usr/local/bin/choco >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$PWD" \
            --entrypoint choco \
            chocolatey/choco:latest-linux "$@"
          EOF
          sudo chmod +x /usr/local/bin/choco

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,winget,homebrew,scoop,nfpm,announce
      - run: ls -R dist | grep -i nupkg
