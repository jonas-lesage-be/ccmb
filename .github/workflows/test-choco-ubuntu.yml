name: test-choco-ubuntu
on:
  push:
    branches:
      - chore/gh-actions-test
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Provide choco via Docker
        run: |
          sudo tee /usr/local/bin/choco >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$PWD" \
            --entrypoint choco \
            chocolatey/choco:latest-linux "$@"
          EOF
          sudo chmod +x /usr/local/bin/choco

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,winget,homebrew,scoop,nfpm,announce
      - run: ls -R dist | grep -i nupkg

      - name: Verify nupkg contents and checksum
        run: |
          nupkg=$(find dist -name '*.nupkg' | head -n1)
          echo "Package: $nupkg"
          unzip -l "$nupkg"
          echo "--- chocolateyinstall.ps1 ---"
          unzip -p "$nupkg" tools/chocolateyinstall.ps1
          zip=$(ls dist/*_windows_amd64.zip | head -n1)
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          echo "zip sha256: $sha"
          unzip -p "$nupkg" tools/chocolateyinstall.ps1 | grep -qi "$sha" \
            && echo "checksum in package matches zip" \
            || { echo "CHECKSUM MISMATCH"; exit 1; }
