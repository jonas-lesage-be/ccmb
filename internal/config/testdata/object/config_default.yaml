source_dir: "."
target_dir: "./_ccmb_output"
target_dir_permissions: 0o700
target_file_permissions: 0o600
text_file_permissions: 0o600

max_flattener_workers: 8
max_document_workers: 8
max_image_workers: 8
max_video_workers: 4
max_visual_merge_workers: 8
image_conversion_timeout: "15s"
video_extract_timeout: "1m"

svg_canvas_resolution: 11.811023622047244
video_fps: 60.0

est_file_count: 128
flat_path_delimiter: "--"
escaped_delimiter: "----"
decode_placeholder: "\x00"
visual_part_prefix: "visual-part-"
text_part_prefix: "text-part-"

max_archive_file_bytes: 4294967296
max_pdf_file_bytes: 50331648
max_text_file_bytes: 2097152

filter_extensions: ~
image_extensions: ~
video_extensions: ~

document_extensions:
  ".doc": true
  ".docx": true
  ".docm": true
  ".odt": true
  ".epub": true
  ".rtf": true

supported_image_extensions:
  ".jpg": true
  ".jpeg": true
  ".png": true
  ".webp": true
  ".tif": true
  ".tiff": true

visual_extensions:
  ".pdf": true
  ".jpg": true
  ".jpeg": true
  ".png": true
  ".webp": true
  ".tif": true
  ".tiff": true

verbose: false
skip_flattener: false
skip_tar_flattener: true
skip_filter: true
skip_image_converter: false
skip_video_extractor: false
skip_visual_merger: false
skip_text_merger: false
