source_dir = "."
target_dir = "./_ccmb-output"
target_dir_permissions = 0o700
target_file_permissions = 0o600
text_file_permissions = 0o600

max_flattener_workers = 8
max_document_workers = 8
max_image_workers = 8
max_video_workers = 4
max_visual_merge_workers = 8

image_conversion_timeout = "15s"
video_extract_timeout = "1m"

svg_canvas_resolution = 11.811023622047244
video_fps = 60.0

est_file_count = 128
flat_path_delimiter = "--"
escaped_delimiter = "----"
decode_placeholder = "\u0000"
visual_part_prefix = "visual-part-"
text_part_prefix = "text-part-"

max_archive_file_bytes = 4294967296
max_pdf_file_bytes = 50331648
max_text_file_bytes = 2097152

disable_in_memory_pdf = true

filter_directories = [
  "dist",
  "build",
  "bin",
  "obj",
  "target",
  "node_modules",
  "vendor",
  ".yarn",
  "__pycache__",
  ".terraform",
  ".gradle",
  ".next",
  ".git",
  "__MACOSX",
]

verbose = true
skip_flattener = true
skip_tar_flattener = true
skip_filter = true
skip_image_converter = true
skip_video_extractor = true
skip_visual_merger = true
skip_text_merger = true

[document_extensions]
".csv" = true
".odt" = true
".ods" = true
".odp" = true
".epub" = true
".rtf" = true
".doc" = true
".docx" = true
".docm" = true
".xls" = true
".xlsx" = true
".xlsm" = true
".ppt" = true
".pptx" = true
".pptm" = true

[supported_image_extensions]
".jpg" = true
".jpeg" = true
".png" = true
".webp" = true
".tif" = true
".tiff" = true

[visual_extensions]
".pdf" = true
".jpg" = true
".jpeg" = true
".png" = true
".webp" = true
".tif" = true
".tiff" = true
