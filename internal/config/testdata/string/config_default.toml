source_dir = "."
target_dir = "./_ccmb_output"
target_dir_permissions = 0o700
target_file_permissions = 0o600
text_file_permissions = 0o600

max_flattener_workers = 8
max_document_workers = 8
max_image_workers = 8
max_video_workers = 4
max_visual_merge_workers = 8
image_conversion_timeout = "15s"
video_extract_timeout = "1m"

svg_canvas_resolution = 11.811023622047244
video_fps = 60.0

est_file_count = 128
flat_path_delimiter = "--"
escaped_delimiter = "----"
decode_placeholder = "\u0000"
visual_part_prefix = "visual-part-"
text_part_prefix = "text-part-"

max_archive_file_bytes = 4294967296
max_pdf_file_bytes = 50331648
max_text_file_bytes = 2097152

disable_in_memory_pdf = true

document_extensions = ".csv,.odt,.ods,.odp,.epub,.rtf,.doc,.docx,.docm,.xls,.xlsx,.xlsm,.ppt,.pptx,.pptm"
supported_image_extensions = ".jpg, .jpeg, .png, .webp, .tif, .tiff"
visual_extensions = ".pdf, .jpg, .jpeg, .png, .webp, .tif, .tiff"

verbose = true
skip_flattener = true
skip_tar_flattener = true
skip_filter = true
skip_image_converter = true
skip_video_extractor = true
skip_visual_merger = true
skip_text_merger = true
