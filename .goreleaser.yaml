version: 2

release:
  github:
    owner: jonas-lesage-be
    name: ccmb
  replace_existing_artifacts: true

before:
  hooks:
    - go mod tidy

builds:
  - id: ccmb-build
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: binary
    formats:
      - binary

  - id: archive-zip
    formats:
      - zip
    files:
      - LICENSE
      - README.md

  - id: archive-tar-gz
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

  - id: archive-tar-zst
    formats:
      - tar.zst
    files:
      - LICENSE
      - README.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - ids:
      - ccmb-build

    images:
      - "contextcombiner/ccmb"
      - "ghcr.io/jonas-lesage-be/ccmb"
    tags:
      - "{{ .Version }}"
      - "latest"

    labels:
      "org.opencontainers.image.title": "ccmb"
      "org.opencontainers.image.description": >-
        Context Combiner (ccmb) is a command-line tool
        that flattens, filters, converts, and merges files.
      "org.opencontainers.image.icon": "https://cdn.jsdelivr.net/gh/jonas-lesage-be/ccmb@main/icon.svg"
      "org.opencontainers.image.source": "https://github.com/jonas-lesage-be/ccmb"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"

winget:
  - package_identifier: "ccmb.ccmb"
    name: "ccmb"
    homepage: "https://github.com/jonas-lesage-be/ccmb"

    publisher: "Jonas Lesage"
    license: "MIT"
    license_url: "https://github.com/jonas-lesage-be/ccmb/blob/main/README.md"

    short_description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files.
    description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files
      from a source directory into a target directory.
    tags:
      - llm
      - context
      - cli
      - utility
      - tool
      - file-merger
      - file-converter
      - ffmpeg
      - pdf
      - ai-tools
      - text-processing
      - cross-platform

    ids:
      - binary

    repository:
      owner: "jonas-lesage-be"
      name: "winget-pkgs"
      branch: "ccmb-{{.Version}}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: "microsoft"
          name: "winget-pkgs"
          branch: "master"

chocolateys:
  - name: ccmb
    ids:
      - archive-zip
    tags: "llm context cli utility tool file-merger file-converter ffmpeg pdf ai foss admin"

    authors: "Jonas Lesage"
    owners: "Jonas Lesage"
    copyright: "Copyright (c) 2026 Jonas Lesage"
    license_url: "https://github.com/jonas-lesage-be/ccmb/blob/main/README.md"

    project_url: "https://github.com/jonas-lesage-be/ccmb"
    icon_url: "https://cdn.jsdelivr.net/gh/jonas-lesage-be/ccmb@main/icon.svg"
    summary: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files.
    description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files
      from a source directory into a target directory.

    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"

scoops:
  - name: ccmb
    homepage: "https://github.com/jonas-lesage-be/ccmb"
    description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files.
    license: "MIT"
    ids:
      - archive-zip

    repository:
      owner: jonas-lesage-be
      name: scoop-bucket
    directory: bucket

homebrew_casks:
  - name: ccmb
    homepage: "https://github.com/jonas-lesage-be/ccmb"
    description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files.
    license: "MIT"
    repository:
      owner: jonas-lesage-be
      name: homebrew-tap
    directory: Casks

    ids:
      - archive-zip

nfpms:
  - id: ccmb-nfpm
    package_name: ccmb
    formats:
      - apk
      - deb
      - rpm
      - archlinux

    homepage: "https://github.com/jonas-lesage-be/ccmb"
    description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files.

    license: "MIT"
    vendor: "Jonas Lesage"
    maintainer: "Jonas Lesage <jonas.lesage@outlook.com>"
