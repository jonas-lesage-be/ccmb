version: 2

release:
  github:
    owner: jonas-lesage-be
    name: ccmb
  replace_existing_artifacts: true

before:
  hooks:
    - go mod tidy

builds:
  - id: ccmb-build
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: archive-zip-or-gzip
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: archive-tar-zst
    formats:
      - tar.zst
    files:
      - LICENSE
      - README.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - ids:
      - ccmb-build

    platforms:
      - linux/amd64
      - linux/arm64

    images:
      - "contextcombiner/ccmb"
      - "ghcr.io/jonas-lesage-be/ccmb"
    tags:
      - "{{ .Version }}"
      - "latest"

    labels:
      "org.opencontainers.image.title": "ccmb"
      "org.opencontainers.image.description": >-
        Context Combiner (ccmb) is a command-line tool
        that flattens, filters, converts, and merges files.
      "org.opencontainers.image.source": "https://github.com/jonas-lesage-be/ccmb"
      "org.opencontainers.image.url": "https://github.com/jonas-lesage-be/ccmb"
      "org.opencontainers.image.documentation": "https://github.com/jonas-lesage-be/ccmb/blob/main/README.md"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .CommitDate }}"

winget:
  - package_identifier: "ccmb.ccmb"
    name: "ccmb"
    package_name: "Context Combiner (ccmb)"
    homepage: "https://github.com/jonas-lesage-be/ccmb"

    publisher: "Jonas Lesage"
    author: "Jonas Lesage"
    publisher_url: "https://github.com/jonas-lesage-be"
    publisher_support_url: "https://github.com/jonas-lesage-be/ccmb/issues"
    copyright: "Copyright (c) 2026 Jonas Lesage"
    copyright_url: "https://github.com/jonas-lesage-be/ccmb/blob/main/LICENSE"

    release_notes: "{{.Changelog}}"
    release_notes_url: "https://github.com/jonas-lesage-be/ccmb/releases/tag/{{ .Version }}"

    license: "MIT"
    license_url: "https://github.com/jonas-lesage-be/ccmb/blob/main/LICENSE"

    short_description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files.
    description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files
      from a source directory into a target directory.
    tags:
      - llm
      - context
      - cli
      - utility
      - tool
      - file-merger
      - file-converter
      - ffmpeg
      - pdf
      - ai-tools
      - text-processing
      - cross-platform

    ids:
      - archive-zip-or-gzip

    repository:
      owner: "jonas-lesage-be"
      name: "winget-pkgs"
      branch: "ccmb-{{.Version}}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: "microsoft"
          name: "winget-pkgs"
          branch: "master"

chocolateys:
  - name: ccmb
    ids:
      - archive-zip-or-gzip

    package_source_url: "https://github.com/jonas-lesage-be/ccmb"
    project_source_url: "https://github.com/jonas-lesage-be/ccmb"
    project_url: "https://github.com/jonas-lesage-be/ccmb"
    docs_url: "https://github.com/jonas-lesage-be/ccmb/blob/main/README.md"
    bug_tracker_url: "https://github.com/jonas-lesage-be/ccmb/issues"
    license_url: "https://github.com/jonas-lesage-be/ccmb/blob/main/LICENSE"
    icon_url: "https://cdn.jsdelivr.net/gh/jonas-lesage-be/ccmb@main/icon.svg"

    title: "Context Combiner (ccmb)"
    authors: "Jonas Lesage"
    owners: "Jonas Lesage"
    copyright: "Copyright (c) 2026 Jonas Lesage"

    tags: "llm context cli utility tool file-merger file-converter ffmpeg pdf ai foss admin"
    summary: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files.
    description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files
      from a source directory into a target directory.
    release_notes: "https://github.com/jonas-lesage-be/ccmb/releases/tag/{{ .Version }}"
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"

scoops:
  - name: ccmb
    homepage: "https://github.com/jonas-lesage-be/ccmb"
    description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files.
    license: "MIT"
    ids:
      - archive-zip-or-gzip

    repository:
      owner: jonas-lesage-be
      name: scoop-bucket
    directory: bucket

homebrew_casks:
  - name: ccmb
    homepage: "https://github.com/jonas-lesage-be/ccmb"
    description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files.
    license: "MIT"
    ids:
      - archive-zip-or-gzip
    binaries:
      - ccmb

    caveats: |
      If you experience Gatekeeper / quarantine issues on macOS, you can run:
      xattr -dr com.apple.quarantine $(brew --prefix)/bin/ccmb

    repository:
      owner: jonas-lesage-be
      name: homebrew-tap
    directory: Casks

nfpms:
  - id: ccmb-nfpm
    package_name: ccmb
    formats:
      - apk
      - deb
      - rpm
      - archlinux

    homepage: "https://github.com/jonas-lesage-be/ccmb"
    description: >-
      Context Combiner (ccmb) is a command-line tool
      that flattens, filters, converts, and merges files.

    license: "MIT"
    vendor: "Jonas Lesage"
    maintainer: "Jonas Lesage <jonas.lesage@outlook.com>"
